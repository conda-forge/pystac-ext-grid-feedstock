schema_version: 1

context:
  version: "1.1.1"

package:
  name: pystac-ext-grid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-grid/pystac_ext_grid-${{ version }}.tar.gz
  sha256: 00070bc4fd26aadc6b21a1f24250e33c1719773fff14487bd0c08b0b89f06438

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.grid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Grid extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-grid/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
