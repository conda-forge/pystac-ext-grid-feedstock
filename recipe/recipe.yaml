schema_version: 1

context:
  version: "1.1.2"

package:
  name: pystac-ext-grid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-grid/pystac_ext_grid-${{ version }}.tar.gz
  sha256: 0da9cea1a53b9f4851c0c9458e969f31bce0fb64ff0120e3b49513213eaa56be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.grid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Grid extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-grid/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
